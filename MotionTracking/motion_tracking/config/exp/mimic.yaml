# @package _global_

defaults:
  - override /algo: mimic
  - override /env: mimic_humanoid

name: mimic
env_path: motion_tracking.envs.${backbone}.mimic_humanoid.MimicHumanoid
training_max_steps: 100000000000
motion_file: null
ref_height_adjust: 0.0

motion_lib:
  _target_: motion_tracking.utils.motion_lib.MotionLib
  motion_file: ${motion_file}
  ref_height_adjust: ${ref_height_adjust}

# Basic env/algo knobs
headless: True
num_envs: 4096
env_spacing: 20
enable_task_obs: False
num_task_obs: 0
enable_height_termination: True
visualize_markers: True
use_max_coords_obs: True
local_root_obs: True
root_height_obs: True
terrain: null
fail_on_bad_grads: False
check_grad_mag: True
bounds_loss_coef: 10
normalize_values: True
normalize_advantage: True
val_clamp_value: 5
max_eval_steps: null
num_games: null
manual_save_every: 50
save_freq: 100000
wandb_log_models: False
checkpoint_save_dir: null
checkpoint: null
algo_extra_inputs: null
save_data_for_cvae: False
use_llc: False
dual_env: False

# Algo
num_steps: 32
tau: 0.95
gamma: 0.99
e_clip: 0.2
batch_size: 16384
task_reward_w: 1.0
num_mini_epochs: 6
use_rand_action_masks: False
manual_gradient_clip_val: 50.0

# Actor config
actor_units: [1024, 512]
actor_activation: relu
actor_initializer: default
actor_use_layer_norm: False
init_logstd: -2.9
learnable_sigma: False
sigma_schedule: null
actor_extra_inputs: null
normalize_obs: True
obs_clamp_value: 5
mu_model:
  _target_: motion_tracking.agents.models.mlp.MultiHeadedMLP
  _recursive_: False
  config:
    initializer: ${actor_initializer}
    units: ${actor_units}
    activation: ${actor_activation}
    normalize_obs: ${normalize_obs}
    obs_clamp_value: ${obs_clamp_value}
    use_layer_norm: ${actor_use_layer_norm}
    extra_inputs: ${actor_extra_inputs}
actor:
  _target_: motion_tracking.agents.models.actor.ActorFixedSigma
  _recursive_: False
  config:
    mu_model: ${mu_model}
    init_logstd: ${init_logstd}
    learnable_sigma: ${learnable_sigma}
    sigma_schedule: ${sigma_schedule}

# Critic config
critic_units: [1024, 512]
critic_activation: relu
clip_critic_loss: True
critic_initializer: default
critic_use_layer_norm: False
critic_extra_inputs: null
shared_actor_critic_base: False
critic:
  _target_: motion_tracking.agents.models.critic.CriticMLP
  _recursive_: False
  config:
    initializer: ${critic_initializer}
    units: ${critic_units}
    activation: ${critic_activation}
    normalize_obs: ${normalize_obs}
    obs_clamp_value: ${obs_clamp_value}
    use_layer_norm: ${critic_use_layer_norm}
    extra_inputs: ${critic_extra_inputs}

# Joint-discriminator config
disable_jd: True
jd_batch_size: null
jd_reward_w: null
jd_grad_penalty: null
jd_replay_keep_prob: null
jd_replay_size: null

jd_units: [1]
jd_num_steps: 10
jd_activation: elu
jd_use_layer_norm: False
jd_weight_decay: 0.0001
jd_logit_weight_decay: 0.01
jd_initializer: default

# Optimizer config
actor_lr: 2e-5
critic_lr: 1e-4
jd_lr: 0
actor_betas: [0.9, 0.999]
critic_betas: [0.9, 0.999]

# Environment config
eval_metrics_every: 500
eval_metric_keys: ["cartesian_err", "gt_err", "dv_rew", "kb_rew", "lr_rew", "rv_rew", "rav_rew", "gr_err", "gr_err_degrees"]
early_terminate_cart_err: null  # 0.03
early_terminate_reward_too_bad_prob: null

max_episode_length: 1000
state_init: Random
hybrid_init_prob: 0

init_start_prob: 0.2

early_reward_term: null

positive_constant: 0
tan_norm_reward: False
global_kb_pos: False

add_rr_to_lr: False
rt_ignore_height: True
sum_before_exp: True
gr_rew_w: 0.0
lr_rew_w: 0.55
gt_rew_w: 0.0
rt_rew_w: 0.0
rv_rew_w: 0.0
rav_rew_w: 0.0
gv_rew_w: 0.1
gav_rew_w: 0.1
kb_rew_w: 0.15
dv_rew_w: 0.15
rh_rew_w: 0.1
kbf_rew_w: 0.0
pow_rew_w: 0.0002
foothold_rew_w: 0.0

gt_rew_c: -1  # -0.01
rt_rew_c: -30
rv_rew_c: -0.5
rav_rew_c: -0.1
gv_rew_c: -0.01
gav_rew_c: -0.01
kb_rew_c: -10
gr_rew_c: -0.1
lr_rew_c: -0.2
dv_rew_c: -0.002
rh_rew_c: -100
kbf_rew_c: -0.01
foothold_metadata_path: null
foothold_contact_force_thresh: 1.0
foothold_core_bonus: 1.0
foothold_edge_penalty: 1.0
foothold_miss_penalty: 1.0

dynamic_sample: False
dynamic_weight_criteria: reward
bucket_width: 1.0
dynamic_weight_pow: 1.0
dynamic_weight_max: 40
update_dynamic_weight_epochs: 5

reset_track_steps_min: 10
reset_track_steps_max: 600
reset_track_grace_period: 5

reset_track_on_reset: False
reset_on_reset_track: True

provide_future_states: False
target_pose_type: null
num_future_steps: 0

residual_control: False
use_phase_obs: False
fixed_motion_id: null
num_motions: null
sync_motion: False
output_motion: False
task_name: null
num_disc_steps: ${jd_num_steps}
dummy_terrain: False

scene_file: abc

eval_overrides:
  num_envs: 16
  headless: False
  init_start_prob: 1.0
  early_reward_term: null
  max_episode_length: 300
  reset_track_steps_min: 300
  reset_track_steps_max: 301
  reset_track_on_reset: True
