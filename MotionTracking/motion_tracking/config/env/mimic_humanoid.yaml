  kbf_rew_w: ${kbf_rew_w}
  pow_rew_w: ${pow_rew_w}
  foothold_rew_w: ${foothold_rew_w}

  dynamic_sample: ${dynamic_sample}
  dynamic_weight_criteria: ${dynamic_weight_criteria}
  bucket_width: ${bucket_width}
  dynamic_weight_pow: ${dynamic_weight_pow}
  dynamic_weight_max: ${dynamic_weight_max}
