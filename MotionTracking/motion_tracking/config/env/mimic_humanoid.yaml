  foothold_metadata_path: ${foothold_metadata_path}
  foothold_contact_force_thresh: ${foothold_contact_force_thresh}
  foothold_core_bonus: ${foothold_core_bonus}
  foothold_edge_penalty: ${foothold_edge_penalty}
  foothold_miss_penalty: ${foothold_miss_penalty}


# Defaults
fixed_motion_per_env: False
pos_rel_to_data: False
force_point_cloud_obs: False
point_sample_radius: 0.0
point_sample_random: False
foothold_metadata_path: null
foothold_rew_w: 0.0
foothold_contact_force_thresh: 1.0
foothold_core_bonus: 1.0
foothold_edge_penalty: 1.0
foothold_miss_penalty: 1.0
