# @package _global_
defaults:
  - disc_humanoid

env_params:
  init_start_prob: ${init_start_prob}
  scene_file: ${scene_file}

  use_phase_obs: ${use_phase_obs}
  relative_kb_pos: ${relative_kb_pos}
  add_rr_to_lr: ${add_rr_to_lr}
  rt_ignore_height: ${rt_ignore_height}
  pos_rel_to_data: ${pos_rel_to_data}

  early_reward_term: ${early_reward_term}
  positive_constant: ${positive_constant}
  tan_norm_reward: ${tan_norm_reward}
  sum_before_exp: ${sum_before_exp}

  gt_rew_c: ${gt_rew_c}
  rt_rew_c: ${rt_rew_c}
  kb_rew_c: ${kb_rew_c}
  gr_rew_c: ${gr_rew_c}
  lr_rew_c: ${lr_rew_c}
  rv_rew_c: ${rv_rew_c}
  rav_rew_c: ${rav_rew_c}
  gv_rew_c: ${gv_rew_c}
  gav_rew_c: ${gav_rew_c}
  dv_rew_c: ${dv_rew_c}
  rh_rew_c: ${rh_rew_c}
  kbf_rew_c: ${kbf_rew_c}

  gt_rew_w: ${gt_rew_w}
